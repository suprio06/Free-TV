<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>Suprio TV</title><style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#151a23;--line:#293140;--accent:#5eead4;--muted:#a4afc0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px Arial,sans-serif}header{background:#11151d;padding:17px;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}h1{color:var(--accent);margin:0 0 14px;font-size:25px}input,select,button{font:inherit;border-radius:9px;padding:11px;border:1px solid var(--line)}input,select{background:#10141c;color:white;width:100%;margin:4px 0}button{background:#252e3c;color:white;cursor:pointer;margin:3px}.primary{background:var(--accent);color:#071411;font-weight:bold}.small{font-size:12px;color:var(--muted)}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px}#summary{padding:12px 14px;color:var(--muted);font-size:13px}#channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:11px;padding:12px}.channel{background:var(--panel);border:1px solid #252c38;border-radius:13px;padding:11px 6px;text-align:center;min-width:0;cursor:pointer}.logo{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:12px;padding:4px}.fallback{height:58px;display:flex;align-items:center;justify-content:center;font-size:28px}.channelName{font-size:13px;margin:8px 0;overflow-wrap:anywhere;line-height:1.35}.status{font-size:11px;color:var(--muted)}.working{color:#5eead4}.maintenance{color:#ffadad}.panel{margin:12px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:13px}#player{position:fixed;inset:0;background:#080a0e;z-index:10;overflow:auto;padding:14px}#video{display:block;width:100%;max-height:58vh;background:black;margin:12px 0}#playerTitle{overflow-wrap:anywhere}#playerMessage{color:var(--muted);line-height:1.5}.hidden{display:none!important}@media(min-width:700px){header,.panel{max-width:900px;margin-left:auto;margin-right:auto}#channels{max-width:1200px;margin:auto}#player{padding:24px 8%}}
</style></head><body><header><h1>▶ Suprio TV</h1><input id="search" placeholder="Search channels..."><div class="filters"><select id="category"><option value="">All categories</option></select><select id="statusFilter"><option value="">All statuses</option><option>Working</option><option>Unverified</option><option>Maintenance</option></select></div><button id="refresh" class="primary">↻ Reload channel data</button><p class="small">Statuses reflect the latest scheduled server-side check and may differ by region/device.</p></header><div id="summary">Loading channels…</div><main id="channels"></main><section id="player" class="hidden"><button id="back">← Back</button><h2 id="playerTitle">Live TV</h2><video id="video" controls playsinline autoplay></video><p id="playerMessage" aria-live="polite">Connecting…</p><p id="streamInfo" class="small"></p><button id="retry" class="primary">Retry</button><button id="nextBackup">Try next backup</button><button id="fullscreen">Fullscreen</button><button id="openStream">Open stream URL</button></section><footer class="panel small">Suprio TV · Third-party streams may be unavailable.</footer><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script><script>
const $=id=>document.getElementById(id);let channels=[],current=null,backup=0,hls=null,attempt=0,timer=null;
async function load(){ $('summary').textContent='Loading channel data…';try{let r=await fetch('./data/channels.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json();channels=d.channels||[];let s=$('category'),old=s.value;s.replaceChildren(new Option('All categories',''));[...new Set(channels.map(c=>c.group||'Other'))].sort().forEach(x=>s.add(new Option(x,x)));if([...s.options].some(o=>o.value===old))s.value=old;render();$('summary').textContent=`${channels.length} channels · Updated ${d.generated_at?new Date(d.generated_at).toLocaleString():'not yet'} · ${d.playlist_count||0} playlists`}catch(e){$('summary').textContent='Could not load data/channels.json. Run the GitHub Action and enable GitHub Pages.'}}
function norm(s){return String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}function render(){let q=norm($('search').value),cat=$('category').value,st=$('statusFilter').value;let list=channels.filter(c=>(!q||norm([c.name,c.country,c.language,c.group].join(' ')).includes(q))&&(!cat||c.group===cat)&&(!st||c.status===st));let box=$('channels');box.replaceChildren();for(let c of list){let card=document.createElement('div');card.className='channel';card.tabIndex=0;let img;if(c.logo&&/^https?:\/\//i.test(c.logo)){img=document.createElement('img');img.className='logo';img.src=c.logo;img.alt='';img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{let f=document.createElement('div');f.className='fallback';f.textContent='📺';img.replaceWith(f)};card.append(img)}else{img=document.createElement('div');img.className='fallback';img.textContent='📺';card.append(img)}let n=document.createElement('div');n.className='channelName';n.textContent=c.name;card.append(n);let b=document.createElement('div');b.className='status '+(c.status||'Unverified').toLowerCase();b.textContent=c.status||'Unverified';card.append(b);if(c.streams.length>1){let x=document.createElement('div');x.className='small';x.textContent=c.streams.length+' streams';card.append(x)}card.onclick=()=>openChannel(c);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openChannel(c)};box.append(card)}if(!list.length){let p=document.createElement('p');p.style.padding='16px';p.textContent='No matching channels.';box.append(p)}}
function stop(){attempt++;if(timer)clearTimeout(timer);timer=null;let v=$('video');v.onplaying=null;v.onerror=null;if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load()}function openChannel(c){current=c;backup=0;$('player').classList.remove('hidden');$('playerTitle').textContent=c.name;play()}function play(){if(!current||!current.streams.length)return;stop();let id=++attempt,url=current.streams[backup],v=$('video');$('playerMessage').textContent=`Trying stream ${backup+1} of ${current.streams.length}…`;$('streamInfo').textContent=`Last check: ${current.checked_at||'unknown'} · Consecutive failures: ${current.consecutive_failures||0}`;let fail=m=>{if(id!==attempt)return;if(timer)clearTimeout(timer);timer=null;$('playerMessage').textContent=m+' Scheduled status is not changed by browser playback.'};v.onplaying=()=>{if(id!==attempt)return;if(timer)clearTimeout(timer);timer=null;$('playerMessage').textContent='Playback started in this browser.'};v.onerror=()=>fail('Browser playback error.');timer=setTimeout(()=>fail('Timed out waiting for playback.'),20000);if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=url;v.play().catch(()=>fail('Autoplay blocked; press Play.'))}else if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true});hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>fail('Press Play to retry.')));hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)fail('HLS playback error.')});hls.loadSource(url);hls.attachMedia(v)}else fail('HLS playback unsupported in this browser.')}function close(){stop();$('player').classList.add('hidden');current=null}
$('search').oninput=render;$('category').onchange=render;$('statusFilter').onchange=render;$('refresh').onclick=load;$('back').onclick=close;$('retry').onclick=play;$('nextBackup').onclick=()=>{if(!current||current.streams.length<2){$('playerMessage').textContent='No backup stream listed.';return}backup=(backup+1)%current.streams.length;play()};$('fullscreen').onclick=()=>{let v=$('video');if(v.requestFullscreen)v.requestFullscreen().catch(()=>{})};$('openStream').onclick=()=>{if(current)window.open(current.streams[backup],'_blank','noopener,noreferrer')};load();
</script></body></html>
